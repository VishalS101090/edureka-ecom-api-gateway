# Server Configuration
server.port=5002

# Spring Application Name
spring.application.name=api-gateway

# Gateway Discovery Configuration (The "Magic" Routing)
# Automatically creates routes based on service names registered in Eureka
spring.cloud.gateway.discovery.locator.enabled=true
# Converts service names to lowercase (e.g., PRODUCT-SERVICE -> /product-service)
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Eureka Client Configuration
# Tells the Gateway where to find the Eureka Server
eureka.client.service-url.defaultZone=http://localhost:5001/eureka/

# Optional: Swagger/OpenAPI aggregation (Master Guide Part 4)
# Access aggregated docs at http://localhost:5002/swagger-ui.html when services are up
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=product-service
springdoc.swagger-ui.urls[0].url=/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=order-service
springdoc.swagger-ui.urls[1].url=/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=customer-service
springdoc.swagger-ui.urls[2].url=/customer-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=inventory-service
springdoc.swagger-ui.urls[3].url=/inventory-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=payment-service
springdoc.swagger-ui.urls[4].url=/payment-service/v3/api-docs
